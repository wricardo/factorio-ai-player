schema:
  - "*.graphqls"
exec:
  filename: graphql_generated.go
  package: main
model:
  filename: graphql_models.go
  package: main
resolver:
  layout: follow-schema
  dir: .
  package: main
  filename_template: "graphql_{name}.resolvers.go"
autobind: []
models:
  UnitNumber:
    model: github.com/wricardo/factorio-ai-player.UnitNumber
  FiniteFloat:
    model: github.com/wricardo/factorio-ai-player.FiniteFloat
