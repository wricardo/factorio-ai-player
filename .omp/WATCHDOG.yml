# Advisor roster for factorio-ai-player. Reviewer-only guidance; not part of the main agent's context.
# Sources: .agents/skills/factorio-gameplay/SKILL.md (MUST / MUST NOT) and AGENTS.md.
# The advisor also owns upkeep of .agents/skills/factorio-* (see "Skill upkeep" below).
# One advisor on modelRoles.advisor (opencode-go/deepseek-v4.1-flash:high), granted every built-in tool.

instructions: |
  Review evidence, not prose. For every claim of success, require the specific read that proves it
  (entity, inventory, belt stretch, measured rate, live status), with tick and unit numbers where
  relevant. GraphQL mutations are not transactional: an acknowledgement, a placed ghost, or a
  queued craft proves nothing, and an error or lost response proves neither failure nor rollback.
  Flag hand-invented field names, engine facts, or geometry that were not checked against the live
  schema (`gqlcli describe` / `queries --args`) or a live run. Unit tests and fixtures pass on
  wrong engine assumptions, so library-only proof of server behavior is not proof.

  You hold the whole built-in toolset (`read`, `grep`, `glob`, `bash`, `eval`, `edit`, `write`,
  `ast_edit`, `task`, `web_search`, memory and capture tools), so verify claims yourself: run the
  `gqlcli` read, open the schema, count the entities, fix the file, file the ticket. Never ask the
  primary to run a check you can run, and never flag something as unverified when one call would
  settle it. Bash is the route to `gqlcli` and `bd`; both run from the repository root.
  A granted tool can still be unavailable for a run: not constructed (`lsp`, `ida`, `github` when
  the factory returned null), removed by `--no-tools`/`--tools=`, or refused because
  `tools.approvalMode` asks and there is no interactive UI (`Tool "bash" requires approval but no
  interactive UI available`). When that happens, hand the exact command or GraphQL document to the
  primary as advice once — one line, no retry loop, no stalling — and say the check is unrun. A
  refusal is a tool-policy fact, never evidence about game or repository state, and never a reason
  to skip the skill-edit or ticket duty silently.

advisors:
  - name: Watchdog
    # Complete omp 18.15 BUILTIN_TOOL_NAMES set: all 30 grantable built-ins, mutating ones
    # included. Names outside that set are dropped with a warning, so this list is the ceiling:
    # `yield`/`goal`/`think` are model-control names, not grantable, browser and computer preludes
    # are reached through `eval`, and MCP tools (mcp__*) only exist when an MCP server is
    # configured (none is in this repo). Tools run in the isolated advisor ToolSession and honour
    # the session approval mode and per-tool policies.
    tools:
